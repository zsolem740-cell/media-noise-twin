details{margin:10px 0}
summary{cursor:pointer;font-weight:600;padding:6px 0;list-style:none}

summary::before{content:"▸ ";color:#4a3716}details[open]>summary::before{content:"▾ "}

.tg{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}

.sm{font-size:13px;color:#3a2c12}
.dark{color:var(--parch)}

.sw{height:20px}
@keyframes sweep{from{transform:rotate(-70deg);opacity:0}to{transform:rotate(0);opacity:1}}

.card .chip.src{color:var(--silver)}.card .chip.calc{color:var(--verd);background:none}.card .chip.ass{color:var(--bad)}

function figSvg(v,h,hl){var w=Math.round(h*0.62);return '<svg viewBox="-8 -12.4 16 24.8" width="'+w+'" height="'+h+'" style="display:block'+(hl?';filter:drop-shadow(0 0 3px #4fb3a1)':'')+'" aria-hidden="true">'+studs(v)+'</svg>';}
function ldOf(v){return ld(v);}
// ===== a Hold, a Nap és a bolygók =====
function sky(ms){var a=astro(ms),el=nm(a.moon-a.sun),b=[["Nap",a.sun,0],["Hold",a.moon,0]];
 PL.forEach(function(p){var l=plon(p[1],ms),l1=plon(p[1],ms+864e5);b.push([p[0].split(' ')[0],l,nm(l1-l)>180?1:0]);});
 return {a:a,el:el,b:b,waxing:el<180,midx:Math.floor(a.moon/(360/28))};}

 var mname=MN[S.midx];var merc=S.b[2];
 L.push({k:'R1',tag:'src',t:'<b>Forrás.</b> Az Eredmény, <i class="lat">'+lat(R)+'</i>, a nagy tárcsán: „'+lr[3]+'” ('+lr[1]+'). A Bíró, <i class="lat">'+lat(Jv)+'</i>: „'+lj[3]+'”.'});
 var s1=cr[0]*2+cr[2];score+=s1;L.push({k:'R1p',tag:'ass',t:'<b>A jelzés kódolása.</b> A szöveget hangnemre és irányra bontottuk: hangnem '+(cr[0]>0?'jó':cr[0]<0?'rossz':'vegyes')+', irány '+(cr[2]>0?'javuló':cr[2]<0?'romló':'változatlan')+'.',s:s1});
 var s2=cj[0];score+=s2;L.push({k:'R1b',tag:'ass',t:'<b>A Bíró hangneme</b> '+(cj[0]>0?'jó':cj[0]<0?'rossz':'vegyes')+'.',s:s2});
 if(ST.RON.R2){var tr=cr[1],t,sc=0;if(tr===0)t='A jelzésnek nincs növekvő vagy csökkenő iránya, a Hold fázisa nem számít.';else{var ok=(tr>0&&S.waxing)||(tr<0&&!S.waxing);var add=ok?cr[2]:-cr[2];sc=sgn(add);score+=sc;t='A jelzés '+(tr>0?'növekvő':'csökkenő')+', a Hold '+(S.waxing?'növekvő':'fogyó')+' ('+phaseName(S.el)+'): '+(ok?'megerősíti':'ellentmond')+'.';}
  L.push({k:'R2',tag:'ass',t:'<b>Hold-fázis.</b> '+t,s:sc});}
 if(ST.RON.R3){var key=norm(mname).replace(/^al-/,'');var hits=[['Eredmény',R],['Bíró',Jv],['1. Tanú',c.W[0]],['2. Tanú',c.W[1]]].filter(function(g){return norm(ld(g[1])[1]).indexOf(key)>=0;});
  L.push({k:'R3',tag:'ass',t:'<b>Holdház-egyezés.</b> A Hold a(z) '+mname+' holdházban jár. '+(hits.length?'Ez szerepel a következők sorában: '+hits.map(function(h){return h[0];}).join(', ')+'. Figyelemre méltó, pontot nem ad.':'Nem szerepel az Eredmény, a Bíró és a Tanúk sorában.'),s:0});}
 if(ST.RON.R4){L.push({k:'R4',tag:'ass',t:'<b>Jegyek.</b> A Nap '+SIGNS[Math.floor(S.a.sun/30)]+', a Hold '+SIGNS[Math.floor(S.a.moon/30)]+' jegyben áll. Tájékoztató, pontot nem ad.',s:0});}
 if(ST.RON.R5){L.push({k:'R5',tag:'ass',t:'<b>Merkúr.</b> '+(merc[2]?'A Merkúr retrográd; a hagyományos csillagjóslás szerint a kérdés körülményei bizonytalanabbak. Pontot nem ad.':'A Merkúr nem retrográd, nincs külön megjegyzés.'),s:0});}
 var verdict=score>=3?'kedvező':score<=-3?'kedvezőtlen':'vegyes';
 return {c:c,R:R,Jv:Jv,lr:lr,lj:lj,L:L,score:score,verdict:verdict};}

 // rögzített elválasztó vonal és jelzők

function pad(n){return n<10?'0'+n:''+n;}
function fmt(ms){var d=new Date(ms);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());}
