 return {h:h,text:sm.text,title:((b.ln+' '+b.fn).trim()||'névtelen')+' · '+b.date};}

// ===== Útmutató =====
function renderSug(){var D=function(t,b){return '<details class="card dark"><summary>'+t+'</summary><div class="sug">'+b+'</div></details>';};
 var h='<div class="row" style="justify-content:space-between;margin:10px 0"><h2 class="serif" style="margin:0;font-size:22px">Útmutató</h2><button class="btn" id="sug_back">Vissza</button></div>'
 +'<div class="card dark"><p style="margin:0 0 6px"><b>Mi ez?</b> Al-Mawṣilī 1241-es geomantikus táblájának digitális változata. A négy forgatható ív, a holdházak és a jelzések a tábla leírásán alapulnak. Erre épül egy kérdező gép, egy születési térkép, számmisztika és egy idősáv. Az app a számolást a telefonon végzi, internet nélkül is működik.</p>'
 +'<p style="margin:0"><b>A címkék jelentése:</b> <span class="chip src">forrás</span> a tábla leírásából jön. <span class="chip calc">számolás</span> csillagászati számítás, ellenőrzött. <span class="chip ass">feltevés</span> vagy <span class="chip ass">hagyomány</span> a mi értelmezésünk, a tábla nem írja le. A gép válasza vizsgálható modell, nem előrejelzés.</p></div>'
 +D('Gyors indulás (5 lépés)','<ol><li>Nyisd meg a <b>Gép</b> fület, és válassz egy témát a „Kérdezz a géptől" kártyán (vagy írd be a kérdésedet).</li><li>Nyomd meg a <b>Kérdés indítása</b> gombot.</li><li>A pörgő számot állítsd meg az <b>Állj!</b> gombbal. A gép 16 megállítást kér.</li><li>A tárcsák maguktól beállnak, és megjelenik a válasz pontszámmal.</li><li>A „Hogyan jött ki?" részben megnézheted, melyik szabály mennyit adott. A „Másolás az MI-nek" gombbal értelmeztetheted a választ egy MI-vel.</li></ol>')
 +D('A hat fül','<p><b>Gép:</b> a négy csúszóív és a Hold fázisa. Az íveket ujjal húzhatod, vagy a ‹ › gombokkal léptetheted. A zöld vonalnál látszó figura az Anya.</p><p><b>Tárcsa:</b> a kis tárcsa 16 szektorral és nyitott ablakkal.</p><p><b>Égbolt:</b> a bolygók helye a Nap körül, és a táblázat a jegyekkel, holdházakkal.</p><p><b>Holdházak:</b> a 28 holdház, melyik kel és melyik nyugszik a te helyeden.</p><p><b>Lánc:</b> az Anyákból, Lányokból, Unokákból, Tanúkból és a Bíróból felépülő lánc, az Eredménnyel.</p><p><b>Születés:</b> a születési térkép, az idősáv, a számmisztika és az összesítő.</p>')
 +D('Kérdezz a géptől','<p><b>Téma:</b> előre beállított témák (munka, kapcsolat, otthon…), vagy írd be a saját kérdésedet, és a gép kulcsszavak alapján besorolja. <b>+ Saját téma</b>: megadod a nevét és a házat, a bolygó a ház természetes uralkodója (átállíthatod). A saját témák elmentődnek a telefonon.</p><p><b>Pörgetés:</b> a <b>Gép</b> fül tetején, a „Kérdezz a géptől" kártyán indul. Az <b>Automata</b> pipával a gép maga pörget és állítja meg a számokat (gépi véletlen), nélküle te állítod az <b>Állj!</b> gombbal. A számok 1-től 9-ig pörögnek, kézi módban a te megállításod időzítése adja a véletlent. Páratlan szám = 1 pont a sorban, páros = 2 pont. A <b>9-es újrapörget</b>, mert különben a páratlan gyakoribb lenne. 4 sor = 1 Anya, 16 megállítás = 4 Anya.</p><p><b>Kalibrálás:</b> minden megállítás után a gép újra beállítja a pörgés sebességét és kezdőszámát az aktuális Hold- és Nap-állásból. Ez rögzíti a kezdőállapotot, de a véletlent nem növeli, azt te adod.</p><p><b>R7 szabály:</b> a téma bolygójának állása (retrográd-e, milyen kapcsolatban áll a Holddal vagy a Nappal) ±1 pontot adhat. Ez a mi feltevésünk.</p><p><b>Korlát:</b> egészségi, pénzügyi és életet érintő kérdésre a gép nem ad tanácsot.</p>')
 +D('Születés: térkép, idősáv, számmisztika','<p><b>Adatok:</b> vezeték- és keresztnév, dátum, helyi idő, hely. A listában 52 hely van, másik helyhez írd be a szélességet és a hosszúságot, és válaszd az időzónát. Ha a pontos időt nem ismered, jelöld be a négyzetet: ilyenkor az aszcendens, a házak és a Hold pontos helye nem számolható.</p><p><b>Térkép:</b> az Aszcendens a bal oldalon van. A házak egész jegyesek. Zöld vonal: szextil, háromszög. Piros: négyzet, szembenállás. Arany: együttállás.</p><p><b>Idősáv:</b> 3, 12 vagy 36 hónap. A fölfelé álló zöld oszlop támogató, a lefelé álló piros kihívást jelez. A pontok a legerősebb kapcsolatok pontos napját mutatják. A pontozási táblázat a „Hogyan számolja a hangnemet?" részben látható.</p><p><b>Számmisztika:</b> pitagoraszi tábla, a név és a dátum alapján.</p><p><b>Összesítő:</b> a térkép, az idősáv, a számmisztika és a Jós gép válasza egy szövegben. Másolható és megosztható.</p>')
 +D('Adatok, törlés, mentés','<p>Alapból be van pipálva: <b>számolás után töröld a beírt adataimat</b>. Ilyenkor a név, a dátum, az idő és a hely kitörlődik, csak a kész összesítő marad meg a „Mentett összesítők" listában (legfeljebb 6). Az összesítő a nevet és a születési dátumot tartalmazza, ezért az is személyes adat a telefonodon. A listából bármikor törölheted.</p><p>Ha kikapcsolod a pipát, a beírt adatok megmaradnak a telefonon, hogy ne kelljen újra beírnod. Az adatok sehova nem mennek el, az app nem küld semmit az internetre.</p><p>Mivel a beírt adatok törlődnek, a kiértékelés később nem hosszabbítható meg: ha újra szeretnéd, írd be újra az adatokat.</p>')
 +D('Hely és idő','<p>Fent a <b>hely</b> gombbal a telefon GPS-ét kérheted le, engedélyezd a kérést. Addig Budapest az alap, ezt a felirat mutatja. Az időpont helyi (közép-európai) idő, a számolás belül világidőben fut. A <b>Most</b> gomb az aktuális időpontot állítja be, a ‹ › gombok egy nappal léptetnek.</p><p>A Hold parallaxisa (kb. 1°) a helyedre van számolva. A születési térképen az asztrológiai szokás szerint a Hold geocentrikus.</p>')
 +D('Telepítés és frissítés a telefonon','<p>Chrome-ban nyisd meg az oldalt, a <b>⋮</b> menüben válaszd a <b>Telepítés és parancsikon</b>, majd az <b>Alkalmazás telepítése</b> pontot. Ha nincs ilyen, kapcsold ki az <b>Asztali webhely</b> jelölést. Az app ezután a kezdőképernyőről indul, internet nélkül is megy.</p><p>Frissítés: ha új verzió került fel az oldalra, zárd be az appot teljesen, és nyisd meg újra, ha kell kétszer.</p>')
 +D('Mi biztos, mi nem?','<p><b>Ellenőrzött számolás:</b> a Nap, a Hold, a bolygók, az Aszcendens és az MC helye (független programmal egyeztetve, a bolygók 0,13° belül, a Hold 0,5° belül), a tranzitok dátuma ±1 nap. A számolás 1800–2049 között érvényes.</p><p><b>Forrás:</b> a 16 figura sorrendje, a nagy tárcsa holdházai és jelzései, az ívek elve.</p><p><b>Feltevés és hagyomány:</b> a jelzések pontozása, a Hold-fázis és a Merkúr hatása, az egyenlő holdház-felosztás, a témák és bolygók párosítása, a tranzitok hangneme, a számmisztika és az asztrológiai szövegek. Ezek hagyományos vagy a mi értelmezéseink, nem bizonyított előrejelzések, és nem tanácsok egészségi, pénzügyi vagy jogi döntéshez.</p>')
 +D('Ha valami nem működik','<ul><li><b>A GPS nem kér engedélyt:</b> a címsorban a lakat ikonra koppintva engedélyezd a helyet, majd próbáld újra.</li><li><b>A hely nincs a listában:</b> írd be a szélességet és a hosszúságot (egy térképalkalmazásban a hely hosszan nyomva megmutatja), és válaszd az időzónát.</li><li><b>„A bolygóhelyek 1800 és 2049 között számolhatók":</b> a születési dátum kívül esik a tartományon.</li><li><b>Az ív nem mozdul húzásra:</b> használd a ‹ › gombokat az ív alatt.</li><li><b>A régi verzió látszik:</b> zárd be teljesen az appot, nyisd meg újra, ha kell, töröld a parancsikont, és vedd fel újra.</li><li><b>Nem fér ki a mentés:</b> töröld a régi mentett összesítőket.</li></ul>');
 $('sug').innerHTML=h;$('sug_back').onclick=function(){show(ST.prev||'gep');};}

var R={gep:renderGep,tarcsa:renderTarcsa,eg:renderEg,hold:renderHold,lanc:renderLanc,szul:renderSz,sug:renderSug};
function show(t){ST.tab=t;if(t!=='sug')ST.prev=t;['gep','tarcsa','eg','hold','lanc','szul','sug'].forEach(function(k){$(k).className='screen'+(k===t?' on':'');});document.querySelector('header').className=(t==='szul'||t==='sug')?'slim':'';document.querySelectorAll('nav button').forEach(function(b){b.className=b.dataset.t===t?'on':'';b.setAttribute('aria-current',b.dataset.t===t?'page':'false');});R[t]();window.scrollTo(0,0);}
function pad(n){return n<10?'0'+n:''+n;}
function fmt(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function tzTxt(ms){var o=-new Date(ms).getTimezoneOffset()/60;return 'UTC'+(o>=0?'+':'')+o;}
function updLoc(){var L=ST.loc;$('lb').firstElementChild.nextSibling.nodeValue=' '+Math.abs(L.lat).toFixed(3)+'°'+(L.lat>=0?'É':'D')+' '+Math.abs(L.lon).toFixed(3)+'°'+(L.lon>=0?'K':'Ny')+' · '+(L.src=='GPS'?'GPS':'alapértelmezett (Budapest)');$('lt').textContent='Helyi idő, '+tzTxt(ST.ms)+'. A számolás világidőben (UTC) fut, a helyi időből átváltva.';}
function setTime(ms){ST.ms=ms;$('ti').value=fmt(ms);updLoc();R[ST.tab]();}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.t);};});
$('ti').onchange=function(){var m=new Date(this.value).getTime();if(!isNaN(m))setTime(m);};
$('tm').onclick=function(){setTime(ST.ms-864e5);};$('tp').onclick=function(){setTime(ST.ms+864e5);};$('tn').onclick=function(){setTime(Date.now());};
$('hlp').onclick=function(){show('sug');};
$('lb').onclick=function(){var lt=$('lt');if(!navigator.geolocation){lt.textContent='Ez a böngésző nem ad helyadatot.';return;}lt.textContent='Hely lekérése, engedélyezd a kérést…';
 navigator.geolocation.getCurrentPosition(function(p){ST.loc={lat:p.coords.latitude,lon:p.coords.longitude,src:'GPS',acc:p.coords.accuracy};save();updLoc();R[ST.tab]();},function(e){lt.textContent=(e.code==1?'A helyhozzáférés le van tiltva. Engedélyezd a böngésző beállításaiban (a lakat ikon az címsorban), majd próbáld újra.':'A GPS most nem érhető el, próbáld újra a szabadban.');},{enableHighAccuracy:true,timeout:20000,maximumAge:60000});};
ST.ms=Date.now();$('ti').value=fmt(ST.ms);updLoc();show('gep');

// ===== nyitóképernyő: forgó égbolt a mai bolygóállásokkal =====
(function(){
var el=$('intro');if(!el)return;
var today=new Date().toISOString().slice(0,10);
try{if(localStorage.getItem('tablaIN')===today)return;}catch(e){}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
var S;try{S=sky(Date.now());}catch(e){return;}
el.hidden=false;
var cv=$('ic'),cx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),W,H,CX,CY,R;
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);CX=W/2;CY=H*0.36;R=Math.min(W*0.4,H*0.3);}
size();
var GL={"Nap":"☉","Hold":"☽","Merkúr":"☿","Vénusz":"♀","Mars":"♂","Jupiter":"♃","Szaturnusz":"♄","Uránusz":"♅","Neptunusz":"♆","Plútó":"♇"};
var B=S.b.filter(function(r){return GL[r[0]];});
var sg=SIGNS[Math.floor(S.a.sun/30)],mg=SIGNS[Math.floor(S.a.moon/30)];
$('itn').textContent='Az égbolt most: Nap '+sg+' '+Math.floor(S.a.sun%30)+'°, Hold '+mg+' '+Math.floor(S.a.moon%30)+'°';
var T0=performance.now(),DUR=3000,closed=false;
function ang(l){return Math.PI-l*Math.PI/180;}
function ease(t){return 1-Math.pow(1-t,3);}
function close(){if(closed)return;closed=true;try{localStorage.setItem('tablaIN',today);}catch(e){}el.classList.add('out');setTimeout(function(){el.hidden=true;},650);}
el.addEventListener('click',close);
setTimeout(close,5200);
function frame(now){
 if(closed)return;
 var t=(now-T0)/1000,p=Math.min(t/(DUR/1000),1),e=ease(p);
 cx.clearRect(0,0,W,H);
 // külső gyűrű: 28 holdház-osztás, lassan forog
 var rot=t*0.06;
 cx.save();cx.translate(CX,CY);
 cx.strokeStyle='rgba(216,184,101,.55)';cx.lineWidth=1.2;cx.beginPath();cx.arc(0,0,R*1.12,0,7);cx.stroke();
 cx.strokeStyle='rgba(216,184,101,.28)';cx.beginPath();cx.arc(0,0,R*1.02,0,7);cx.stroke();
 for(var i=0;i<28;i++){var a=rot+i*Math.PI*2/28;cx.beginPath();cx.moveTo(Math.cos(a)*R*1.02,Math.sin(a)*R*1.02);cx.lineTo(Math.cos(a)*R*1.12,Math.sin(a)*R*1.12);cx.strokeStyle='rgba(216,184,101,.5)';cx.stroke();}
 // 12 jegy-osztás, ellentétes irányban
 for(var j=0;j<12;j++){var b=-rot*1.6+j*Math.PI/6;cx.beginPath();cx.moveTo(Math.cos(b)*R*0.2,Math.sin(b)*R*0.2);cx.lineTo(Math.cos(b)*R*1.0,Math.sin(b)*R*1.0);cx.strokeStyle='rgba(236,228,208,.07)';cx.stroke();}
 // pályák és bolygók
 B.forEach(function(r,i){
  var orr=R*(0.3+0.07*i),fin=ang(r[1]);
  var start=fin+(i%2?-1:1)*(Math.PI*2*(2.2+i*0.18));
  var a=start+(fin-start)*e;
  cx.strokeStyle='rgba(236,228,208,.10)';cx.lineWidth=1;cx.beginPath();cx.arc(0,0,orr,0,7);cx.stroke();
  var x=Math.cos(a)*orr,y=-Math.sin(a)*orr;
  var big=(r[0]==='Nap'||r[0]==='Hold');
  var g=cx.createRadialGradient(x,y,0,x,y,big?16:11);g.addColorStop(0,big?'rgba(255,224,140,.85)':'rgba(216,184,101,.6)');g.addColorStop(1,'rgba(216,184,101,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,big?16:11,0,7);cx.fill();
  cx.fillStyle=big?'#fff2c4':'#ece4d0';cx.font=(big?15:13)+'px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(GL[r[0]]+'︎',x,y+1);
 });
 // közép: a tárcsa ellentétesen forgó pontjai
 for(var k=0;k<16;k++){var c=-rot*3+k*Math.PI/8,rr=R*0.16;cx.fillStyle=k%2?'rgba(216,184,101,.9)':'rgba(236,228,208,.5)';cx.beginPath();cx.arc(Math.cos(c)*rr,Math.sin(c)*rr,k%2?2.4:1.6,0,7);cx.fill();}
 cx.restore();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',size);
})();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
