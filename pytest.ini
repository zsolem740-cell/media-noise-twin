[pytest]
testpaths = tests validation/hu_pilot/tests trading_model/tests video_research/tests
python_files = test_*.py
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    unit: gyors, izolált egységtesztek (kappa, vote validation, anchor verification, sentiment heuristic)
    integration: modulok közötti tesztek mockolt átvitellel (kvóta, naplózás, failover tiltás, zip csomagolás, calibration)
    e2e: helyi böngészős smoke tesztek (szakaszváltás, localStorage megmaradás, export roundtrip)
    live_api: tiltott élő API tesztek (alapértelmezetten kizárva)
