# Használat a tároló gyökeréből: docker compose -f video_research/docker-compose.yml up --build
# Titkok (VR_API_TOKEN, APIFY_TOKEN, POSTGRES_PASSWORD) csak a helyi, gitből kizárt .env fájlból jönnek.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vr
      POSTGRES_USER: vr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?állítsd be a .env fájlban}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U vr"], interval: 5s, retries: 10}
  migrate:
    build: {context: .., dockerfile: video_research/Dockerfile}
    command: ["python", "-m", "video_research.main", "migrate"]
    env_file: .env
    environment: &env
      VR_DATABASE_URL: postgresql+psycopg://vr:${POSTGRES_PASSWORD}@db:5432/vr
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: video_research/Dockerfile}
    env_file: .env
    environment: *env
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  worker:
    build: {context: .., dockerfile: video_research/Dockerfile}
    command: ["python", "-m", "video_research.main", "worker"]
    env_file: .env
    environment: *env
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  pgdata:
