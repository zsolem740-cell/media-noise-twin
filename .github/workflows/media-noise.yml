name: media-noise

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/user.json", "inbox/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: media-noise
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Projekt kibontása (egyszeri, utána a projekt a repó fájljaiban él)
