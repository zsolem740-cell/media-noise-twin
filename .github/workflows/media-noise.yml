name: media-noise

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/user.json", "inbox/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: media-noise
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Projekt ellenőrzése
        run: |
          if [ ! -f PROJECT_VERSION ] || [ ! -d src ] || [ ! -d public ]; then
            echo "::error::Hiányzik a PROJECT_VERSION, a src/ vagy a public/ – a projekt nincs a repóban."
            exit 1
          fi
          echo "Projekt: $(cat PROJECT_VERSION)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest

      - name: Postaláda (inbox/*.txt frissítés-csomagok)
        id: inbox
        run: |
          shopt -s nullglob
          files=(inbox/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nincs új csomag."
            exit 0
          fi
          git config user.name "media-noise-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p inbox/failed
          ALLOWED='^(\./)?((src|public)(/.*)?|config/(sources|user\.example)\.json|requirements\.txt|README\.md|PROJECT_VERSION|\.gitignore|PATCH_DELETE\.txt)$'
          rollback() {
            git reset -q --hard HEAD
            git clean -fdq src public tests
          }
          reject() {
            echo "::error::$(basename "$1"): $2"
            echo "- $(basename "$1"): ELUTASÍTVA – $2" >> "$GITHUB_STEP_SUMMARY"
            echo "$(date -u +%FT%TZ) $(basename "$1") ELUTASÍTVA: $2" >> inbox/LOG.md
            mv "$1" "inbox/failed/$(basename "$1")"
            git add -A inbox
            git commit -q -m "Postaláda: $(basename "$1") elutasítva"
          }
          applied=0
          for f in "${files[@]}"; do
            name=$(basename "$f")
            echo "== $name"
            w=$(mktemp -d)
            if ! tr -d ' \r\n\t`' < "$f" | base64 -d > "$w/p.tgz" 2>/dev/null; then reject "$f" "nem érvényes base64"; continue; fi
            if ! tar tzf "$w/p.tgz" > "$w/list.txt" 2>/dev/null; then reject "$f" "nem tar.gz csomag"; continue; fi
            tar tvzf "$w/p.tgz" > "$w/long.txt" 2>/dev/null
            if ! awk 'BEGIN{b=0} {c=substr($0,1,1); if (c!="-" && c!="d") b=1} END{exit b}' "$w/long.txt"; then reject "$f" "tiltott fájltípus (link vagy eszköz)"; continue; fi
            if grep -Eq '(^|/)\.\.(/|$)|^/' "$w/list.txt"; then reject "$f" "tiltott útvonal (.. vagy /)"; continue; fi
            bad=$(grep -Ev "$ALLOWED" "$w/list.txt" | head -3 | tr '\n' ' ' || true)
            if [ -n "${bad// /}" ]; then reject "$f" "nem engedélyezett útvonal: $bad"; continue; fi
            mkdir "$w/x"
            tar xzf "$w/p.tgz" -C "$w/x" --no-same-owner --no-same-permissions
            if [ -f "$w/x/PATCH_DELETE.txt" ]; then
              bad_del=""
              while IFS= read -r p || [ -n "$p" ]; do
                p=${p%$'\r'}
                [ -z "$p" ] && continue
                if printf '%s\n' "$p" | grep -Eq '^(src|public)/[A-Za-z0-9_./-]+$' && ! printf '%s\n' "$p" | grep -Eq '(^|/)\.\.(/|$)'; then
                  rm -f -- "$p"
                else
                  bad_del="$p"
                fi
              done < "$w/x/PATCH_DELETE.txt"
              if [ -n "$bad_del" ]; then rollback; reject "$f" "tiltott törlési útvonal: $bad_del"; continue; fi
              rm -f "$w/x/PATCH_DELETE.txt"
            fi
            cp -a "$w/x/." ./
            ok=1
            python3 -c 'import ast,json,pathlib;[ast.parse(p.read_text(encoding="utf-8"),str(p)) for p in pathlib.Path("src").rglob("*.py")];json.loads(pathlib.Path("config/sources.json").read_text(encoding="utf-8"))' || ok=0
            while IFS= read -r js; do
              cp "$js" "$w/t.mjs"
              node --check "$w/t.mjs" || ok=0
            done < <(find public -name '*.js')
            if [ "$ok" != "1" ]; then rollback; reject "$f" "az ellenőrzés (Python/JS/JSON szintaxis) hibát talált, a csomag nem lett alkalmazva"; continue; fi
            if [ -d tests ]; then
              pip install -q -r requirements.txt >/dev/null 2>&1 || true
              if ! python3 -m pytest -q tests > "$w/pytest.txt" 2>&1; then
                tail -20 "$w/pytest.txt"
                rollback; reject "$f" "a tesztek elbuktak ($(tail -1 "$w/pytest.txt")), a csomag nem lett alkalmazva"; continue
              fi
            fi
            git add -A src public tests config requirements.txt README.md PROJECT_VERSION .gitignore
            git rm -q -f -- "$f"
            echo "$(date -u +%FT%TZ) $name OK ($(cat PROJECT_VERSION 2>/dev/null))" >> inbox/LOG.md
            echo "- $name: alkalmazva ($(cat PROJECT_VERSION 2>/dev/null))" >> "$GITHUB_STEP_SUMMARY"
            git add inbox/LOG.md
            git commit -q -m "Frissítés alkalmazva: $name ($(cat PROJECT_VERSION 2>/dev/null))"
            applied=1
          done
          if [ "$applied" = "1" ]; then echo "applied=true" >> "$GITHUB_OUTPUT"; fi
          git pull --rebase -q origin main || true
          git push

      - name: Tesztek
        run: python -m pytest -q tests

      - name: Előző adat a data ágról
        run: scripts/data_branch.sh pull

      - name: Hírek gyűjtése
        run: python -m src.collectors.google_news
      - name: Cikkszövegek elemzése (hibája nem állítja meg a futást)
        continue-on-error: true
        run: python -m src.collectors.article
      - name: ATM számítás
        run: python -m src.core.atm_engine
      - name: Értesítések (ha van NTFY_TOPIC titok)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.core.notify

      - name: Adat mentése (data ág)
        id: commit
        run: |
          git config user.name "media-noise-bot"
          git config user.email "actions@users.noreply.github.com"
          changed=$(scripts/data_branch.sh push "ATM frissítés $(date -u +%FT%TZ)" | tail -1)
          echo "$changed"
          scripts/data_branch.sh untrack
          if [ "$changed" = "changed=true" ] || [ "${{ github.event_name }}" != "schedule" ] || [ -n "${{ steps.inbox.outputs.applied }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Oldal összeállítása
        if: steps.commit.outputs.deploy == 'true'
        run: |
          mkdir _site
          cp -r public/. _site/
          cp data/metrics/atm_history.json _site/ || true

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
