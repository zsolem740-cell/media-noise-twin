name: Média-Zaj Twin

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_extract:
        description: "A fájlok újrakicsomagolása (felülírja a kézi módosításokat): igen / nem"
        default: "nem"
  push:
    paths:
      - ".github/workflows/media-noise.yml"

permissions:
  contents: write

concurrency:
  group: media-noise
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Önkicsomagolás (v38)
        env:
          FORCE: ${{ github.event.inputs.force_extract }}
        run: |
          set -e
          if [ -f .mnt-version ] && [ "$(cat .mnt-version)" = "v38" ] && [ "$FORCE" != "igen" ]; then
            echo "A v38 fájlok már kicsomagolva, kihagyom."
            exit 0
          fi
          echo "Kicsomagolás: Média-Zaj Twin v38"
          mkdir -p "$(dirname 'index.html')"
          cat > 'index.html' <<'__MNT_EOF_1__'
          <!doctype html>
          <html lang="hu">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#030406">
          <meta name="mobile-web-app-capable" content="yes">
          <title>Média-Zaj Twin</title>
          <link rel="manifest" href="manifest.webmanifest">
          <link rel="icon" href="icons/icon-192.png">
          <link rel="apple-touch-icon" href="icons/icon-192.png">
          <link rel="stylesheet" href="css/hud.css">
          <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
          </head>
          <body>
          <div id="globe" aria-label="3D glóbusz a hírek helyszíneivel"></div>
          <main id="app">
            <header class="hud glass">
              <div class="title"><b>MÉDIA-ZAJ TWIN</b><small>Vas megye / Alpokalja · ATM = G·S·(1−V) · v38 · <span id="kind">…</span></small></div>
              <div class="tiles">
                <div class="tile"><b id="m-atm">–</b><small>ATM átlag (×100)</small></div>
                <div class="tile"><b id="m-p90">–</b><small>p90 (×100)</small></div>
                <div class="tile"><b id="m-n">–</b><small>hírek száma</small></div>
                <div class="tile"><b id="m-upd">–</b><small>frissítve</small></div>
              </div>
              <div class="spark"><canvas id="spark"></canvas><span id="learn" class="dim"></span></div>
              <div id="banner" class="banner"></div>
              <div class="btns">
                <button id="b-refresh" title="Adatok újratöltése">⟳ Frissítés</button>
                <button id="b-focus" title="Vas megye a gömb közepére">◎ Fókusz</button>
                <button id="b-auto" title="Automatikus forgás">↻ Forgás</button>
                <button id="b-settings" title="Beállítások">⚙</button>
              </div>
            </header>
            <section id="sheet" class="sheet glass">
              <button id="b-sheet" class="handle" aria-label="Lista mutatása/rejtése"><i></i></button>
              <div class="filters">
                <div id="chips" class="chips">
                  <button data-scope="official">Hivatalos</button><button data-scope="local">Helyi</button>
                  <button data-scope="national">Országos</button><button data-scope="international">Nemzetközi</button>
