          def hav_km(a, b, c, d):
              p = math.pi / 180
              x = math.sin((c - a) * p / 2) ** 2 + math.cos(a * p) * math.cos(c * p) * math.sin((d - b) * p / 2) ** 2
              return 2 * 6371 * math.asin(math.sqrt(x))


