                    <option value="clean">Legtisztább elöl</option><option value="recent">Legfrissebb elöl</option>
                  </select>
                  <label class="chk"><input id="hide" type="checkbox"> zaj elrejtése</label>
                  <input id="thr" type="range" min="2" max="40" value="25" aria-label="ATM-plafon"><span id="thr-val" class="dim">25.0</span>
                </div>
              </div>
              <p id="empty" class="dim pad" hidden>Még nincs adat. A GitHubon: Actions › Média-Zaj Twin › Run workflow, majd frissíts.</p>
              <div id="list"></div>
              <button id="more" class="more" hidden>Továbbiak</button>
              <p class="dim pad foot">A pontszám tájékoztató, nem igazságmérő. Az ATM a szöveg jellemzőiből és a mért környezeti adatokból számolt kísérleti mutató.</p>
            </section>
          </main>
          <div id="settings" class="modal" hidden>
            <div class="glass box">
              <h2>Beállítások</h2>
              <p class="dim">A tanult szűrő és a szavazatok csak ezen a telefonon tárolódnak.</p>
              <button id="s-reset">Tanulás és szavazatok törlése</button>
              <button id="s-2d">Egyszerű 2D glóbusz</button>
              <button id="s-close" class="ghost">Bezárás</button>
            </div>
          </div>
          <noscript><p style="padding:2rem;color:#fff">Az alkalmazáshoz JavaScript szükséges.</p></noscript>
          <script type="module" src="js/app.js"></script>
          </body>
          </html>
          __MNT_EOF_1__
          mkdir -p "$(dirname 'manifest.webmanifest')"
          cat > 'manifest.webmanifest' <<'__MNT_EOF_2__'
          {"name":"Média-Zaj Twin","short_name":"Zaj-Twin","description":"Helyi és nemzetközi hírek zajmérője: ATM = G·S·(1−V), fizikai keresztellenőrzéssel.","lang":"hu","start_url":"./","scope":"./","display":"standalone","orientation":"portrait","background_color":"#030406","theme_color":"#030406","icons":[{"src":"icons/icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}
          __MNT_EOF_2__
          mkdir -p "$(dirname 'sw.js')"
          cat > 'sw.js' <<'__MNT_EOF_3__'
          /* Média-Zaj Twin v38 – service worker. Héj: gyorsítótárból (közben frissül); adat/konfig: hálózat először; Three.js: külön, tartós gyorsítótár. */
          const V = "mnt-v38", LIB = "mnt-lib-three-160";
          const SHELL = ["./", "index.html", "css/hud.css", "js/app.js", "js/modules/webglGlobe.js", "js/modules/filterEngine.js", "manifest.webmanifest", "icons/icon-192.png", "icons/icon-512.png"];
          self.addEventListener("install", (e) => { e.waitUntil(caches.open(V).then((c) => c.addAll(SHELL)).then(() => self.skipWaiting())); });
          self.addEventListener("activate", (e) => {
            e.waitUntil(caches.keys().then((ks) => Promise.all(ks.filter((k) => k.startsWith("mnt-") && k !== V && k !== LIB).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
          });
          self.addEventListener("fetch", (e) => {
            const r = e.request; if (r.method !== "GET") return;
            const u = new URL(r.url);
            if (u.hostname.endsWith("jsdelivr.net")) {
              e.respondWith(caches.open(LIB).then((c) => c.match(r).then((hit) => hit || fetch(r).then((res) => { if (res.ok) c.put(r, res.clone()); return res; }))));
            } else if (u.origin === location.origin && (u.pathname.includes("/data/") || u.pathname.includes("/config/"))) {
              e.respondWith(fetch(r).then((res) => { if (res.ok) caches.open(V).then((c) => c.put(r, res.clone())); return res; }).catch(() => caches.match(r)));
            } else if (u.origin === location.origin) {
              e.respondWith(caches.match(r).then((hit) => { const net = fetch(r).then((res) => { if (res.ok) caches.open(V).then((c) => c.put(r, res.clone())); return res; }).catch(() => hit); return hit || net; }));
            }
          });
          __MNT_EOF_3__
          mkdir -p "$(dirname 'css/hud.css')"
          cat > 'css/hud.css' <<'__MNT_EOF_4__'
          :root{--bg:#030406;--ink:#dbe7ff;--dim:#8193a5;--line:rgba(120,160,255,.18);--cy:#06b6d4;--vi:#8b5cf6;--am:#f59e0b;--rd:#ef4444;--gr:#34d399;
          --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--mono);overflow:hidden}
          #globe{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#0a1230 0%,#030406 70%)}
          .globe-canvas{display:block;width:100%;height:100%}
          #app{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;padding-top:var(--sat)}
          .glass{background:rgba(10,16,30,.58);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
          .hud{pointer-events:auto;margin:8px 8px 0;padding:10px 12px;border-radius:16px}
          .title b{display:block;letter-spacing:.14em;color:var(--am);font-size:15px}
          .title small{display:block;color:var(--dim);font-size:11px}
          .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 6px}
          .tile{background:rgba(5,10,24,.6);border:1px solid var(--line);border-radius:10px;padding:5px 6px;text-align:center;min-width:0}
          .tile b{display:block;font-size:17px;color:var(--cy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .tile small{display:block;color:var(--dim);font-size:9.5px;line-height:1.15}
          .spark{display:flex;align-items:center;gap:8px}.spark canvas{width:96px;height:28px;flex:none}
          .dim{color:var(--dim);font-size:11px}.pad{padding:10px 14px}.foot{text-align:center}
          .banner{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.banner span{font-size:10.5px;padding:2px 7px;border:1px solid var(--line);border-radius:999px;background:rgba(6,182,212,.07)}
          .btns{display:flex;gap:6px;margin-top:8px}
          button,select{font:inherit;color:var(--ink);background:rgba(6,182,212,.08);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px}
          button:active{background:rgba(6,182,212,.22)}button.off{opacity:.45}button.ghost{background:transparent}
          .btns button{flex:1}.btns #b-settings{flex:0 0 auto}
          .sheet{pointer-events:auto;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:56vh;overflow:auto;overscroll-behavior:contain;padding-bottom:calc(var(--sab) + 8px);transition:transform .25s}
          .peek .sheet{transform:translateY(calc(100% - 38px))}
          .handle{position:sticky;top:0;z-index:2;display:block;width:100%;background:rgba(10,16,30,.85);border:0;border-radius:18px 18px 0 0;padding:8px 0;min-height:0}
          .handle i{display:block;width:44px;height:4px;border-radius:2px;background:var(--dim);margin:0 auto}
          .filters{padding:4px 10px 6px}
          .chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{padding:5px 10px;min-height:30px;border-radius:999px;font-size:12px}
          .chips button.off{opacity:.4;text-decoration:line-through}
          .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
          .ctl select{flex:1;min-width:140px}.chk{display:flex;align-items:center;gap:4px;font-size:12px}.ctl input[type=range]{flex:1;min-width:80px;accent-color:var(--vi)}
          .card{margin:6px 8px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:rgba(5,10,24,.55)}
          .card.sel{border-color:var(--vi);box-shadow:0 0 0 1px var(--vi),0 0 18px rgba(139,92,246,.35)}
          .card .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
          .atm{color:#06121a;background:var(--c);padding:1px 8px;border-radius:999px;font-weight:700}
          .scope{border:1px solid var(--line);padding:0 7px;border-radius:999px}.time{margin-left:auto}
          .card h3{margin:6px 0 2px;font-size:14px;line-height:1.35;font-weight:600}.card h3 a{color:var(--ink);text-decoration:none}
          .meta{color:var(--dim);font-size:11px}
          .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0 4px}
          .bar{position:relative;height:15px;border-radius:5px;background:rgba(120,160,255,.10);overflow:hidden}
          .bar i{position:absolute;inset:0 auto 0 0;opacity:.55}.bar.g i{background:var(--am)}.bar.s i{background:var(--rd)}.bar.v i{background:var(--gr)}
          .bar b{position:relative;font-size:10px;font-weight:600;padding-left:5px;line-height:15px}
          .tags{display:flex;gap:5px;flex-wrap:wrap}.tags em{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:999px;background:rgba(139,92,246,.18)}
          .tags em.ok{background:rgba(52,211,153,.18);color:var(--gr)}.tags em.bad{background:rgba(239,68,68,.18);color:#fca5a5}
          .detail p{margin:6px 0 0;font-size:12px}.votes{display:flex;gap:6px;margin-top:8px}.votes button{flex:1;padding:6px;font-size:12px}
          .votes button.on{background:rgba(139,92,246,.35);border-color:var(--vi)}
          .more{display:block;margin:8px auto}
          .modal{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
          .modal[hidden]{display:none}.box{border-radius:16px;padding:16px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px}.box h2{margin:0;font-size:16px;color:var(--am)}
          @media (min-width:820px){#app{flex-direction:row;padding:var(--sat) 8px 8px}.hud{width:380px;margin:0;align-self:flex-start}.sheet{margin:0 0 0 auto;width:460px;max-height:none;height:100%;border-radius:18px}.peek .sheet{transform:none}.handle{display:none}}
          @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
          __MNT_EOF_4__
          mkdir -p "$(dirname 'js/app.js')"
          cat > 'js/app.js' <<'__MNT_EOF_5__'
          /* Média-Zaj Twin v38 – kliensoldali alkalmazás (HUD, lista, glóbusz, tanuló szűrő). */
          import { createGlobe, atmColor, rgbCss } from "./modules/webglGlobe.js";
          import { FilterEngine } from "./modules/filterEngine.js";

          const $ = (id) => document.getElementById(id);
          const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
          const SCOPE_HU = { official: "Hivatalos", local: "Helyi", national: "Országos", international: "Nemzetközi" };
          const TOPIC_HU = { earthquake: "földrengés", solar: "napkitörés", geomagnetic: "geomágneses", storm: "vihar", flood: "árvíz" };
          const DEF_TH = { mid: 0.12, high: 0.25 };
          const S = { arts: [], meta: null, hist: [], scopes: { official: true, local: true, national: true, international: true }, mode: "learned", hide: false, thr: 0.25, limit: 50, selected: null };
          const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
          const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* tele a tár */ } };
          const engine = new FilterEngine();
          const votes = lsGet("mnt.votes.v38", {});
          const prefs = lsGet("mnt.pref.v38", { fallback: false, auto: true });
          let globe = null, reading = null;

          const th = () => (S.meta && S.meta.thresholds) || DEF_TH;
          const pctl = (v, p) => { if (!v.length) return 0; const a = [...v].sort((x, y) => x - y), k = (a.length - 1) * p, lo = Math.floor(k), hi = Math.ceil(k); return a[lo] + (a[hi] - a[lo]) * (k - lo); };
          const ts = (a) => Date.parse(a.published || a.first_seen || 0) || 0;
          export function ago(iso, now = Date.now()) {
            const t = Date.parse(iso); if (!t) return "–";
            const m = Math.max(0, Math.round((now - t) / 60000));
            return m < 1 ? "most" : m < 60 ? m + " perce" : m < 1440 ? Math.round(m / 60) + " órája" : Math.round(m / 1440) + " napja";
          }
          const atmTxt = (v) => (v * 100).toFixed(1);
          export const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? String(u) : "#");

          /* ───────── adatok ───────── */
          async function getJson(url) { const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }
          async function load() {
            try {
              const d = await getJson("data/articles.json");
              S.arts = d.articles || []; S.meta = d.meta || null;
              try { S.hist = (await getJson("data/metrics/atm_history.json")).points || []; } catch (e) { S.hist = []; }
              $("empty").hidden = true;
            } catch (e) {
              S.arts = []; S.meta = null; $("empty").hidden = false;
            }
            render();
          }

          /* ───────── szűrés és sorrend ───────── */
          export function ordered(list, mode, eng) {
            const a = [...list];
            if (mode === "noisy") a.sort((x, y) => y.atm - x.atm);
            else if (mode === "clean") a.sort((x, y) => x.atm - y.atm);
            else if (mode === "recent") a.sort((x, y) => ts(y) - ts(x));
            else { const sc = new Map(a.map((x) => [x.id, eng.score(x).score])); a.sort((x, y) => sc.get(y.id) - sc.get(x.id) || ts(y) - ts(x)); }
            return a;
          }
          const visible = () => ordered(S.arts.filter((a) => S.scopes[a.scope] && (!S.hide || a.atm <= S.thr)), S.mode, engine);

          /* ───────── HUD ───────── */
          function renderHud(list) {
            const day = list.filter((a) => ts(a) >= Date.now() - 864e5), v = (day.length ? day : list).map((a) => a.atm);
            const mean = v.length ? v.reduce((x, y) => x + y, 0) / v.length : 0, p90 = pctl(v, 0.9), t = th();
            $("m-atm").textContent = atmTxt(mean); $("m-atm").style.color = rgbCss(atmColor(mean, t));
            $("m-p90").textContent = atmTxt(p90); $("m-p90").style.color = rgbCss(atmColor(p90, t));
            $("m-n").textContent = String(list.length);
            const g = S.meta && S.meta.generated_at;
            $("m-upd").textContent = g ? ago(g) : "–";
            const st = engine.stats();
            $("learn").textContent = `Tanuló szűrő: λ ${st.lambda.toFixed(2)} · AUC ${st.auc === null ? "–" : st.auc.toFixed(2)} · ${st.trained} tanítás`;
            const m = S.meta || {}, b = [];
            if (m.official) b.push(m.official.calm === false ? "🚨 HungaroMet: érvényes figyelmeztetés" : m.official.calm === true ? "✅ HungaroMet: nincs figyelmeztetés" : "ℹ HungaroMet: állapot ismeretlen");
            if (m.truth) b.push(m.truth.available ? "🔬 Fizikai mérés: " + ((m.truth.flags || []).length ? m.truth.flags.map((f) => TOPIC_HU[f] || f).join(", ") : "nyugodt") : "🔬 Fizikai mérés: nincs adat");
            if (m.warming_up) b.push("📈 Trend: gyűjtés (24 óra kell)");
            else if ((m.rising || []).length) b.push("📈 Felszálló: " + m.rising.slice(0, 3).map((r) => r.term).join(", "));
            const errs = Object.keys(m.errors || {});
            if (errs.length) b.push("⚠ Nem elérhető forrás: " + errs.join(", "));
            if (g && Date.now() - Date.parse(g) > 3 * 36e5) b.push("🕒 Az adat " + ago(g) + " változott (nincs új érdemi változás, vagy áll a gyűjtés)");
            $("banner").innerHTML = b.map((x) => `<span>${esc(x)}</span>`).join("");
            spark();
          }
          function spark() {
            const cv = $("spark"), ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth || 120, h = cv.clientHeight || 30;
            cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
            const pts = S.hist.filter((p) => Date.parse(p.t) > Date.now() - 7 * 864e5); if (pts.length < 2) return;
            const t0 = Date.parse(pts[0].t), t1 = Date.parse(pts[pts.length - 1].t) || t0 + 1, mx = Math.max(0.05, ...pts.map((p) => p.p90 || p.mean));
            const line = (key, col, dash) => { ctx.beginPath(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = 1.4; pts.forEach((p, i) => { const x = (Date.parse(p.t) - t0) / (t1 - t0) * (w - 2) + 1, y = h - 2 - (p[key] / mx) * (h - 4); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); };
            line("p90", "rgba(245,158,11,.8)", [3, 3]); line("mean", "rgba(6,182,212,.95)", []);
          }

          /* ───────── lista ───────── */
          function bar(label, v, cls) { return `<span class="bar ${cls}"><i style="width:${Math.round(v * 100)}%"></i><b>${label} ${v.toFixed(2)}</b></span>`; }
          function card(a, sc) {
            const c = rgbCss(atmColor(a.atm, th())), vt = votes[a.id], tr = a.truth || {};
            const tags = (a.topics || []).map((t) => `<em>${esc(TOPIC_HU[t] || t)}</em>`).join("");
            const badge = tr.verdict === "igazolt" ? `<em class="ok">✔ fizikailag igazolt</em>` : tr.verdict === "nem igazolt" ? `<em class="bad">⚠ fizikailag nem igazolt</em>` : "";
            return `<article class="card${S.selected === a.id ? " sel" : ""}" data-id="${esc(a.id)}">
