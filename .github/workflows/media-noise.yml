      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - name: Hírek gyűjtése
        run: python -m src.collectors.google_news
      - name: Cikkszövegek elemzése (hibája nem állítja meg a futást)
        continue-on-error: true
        run: python -m src.collectors.article
      - name: ATM számítás
        run: python -m src.core.atm_engine
      - name: Értesítések (ha van NTFY_TOPIC titok)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m src.core.notify

      - name: Adat mentése
        id: commit
        run: |
          git config user.name "media-noise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metrics/atm_history.json
          if git diff --staged --quiet; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git commit -m "ATM frissítés $(date -u +%FT%TZ)"
            git push
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Oldal összeállítása
        if: steps.commit.outputs.deploy == 'true'
        run: |
          mkdir _site
          cp -r public/. _site/
          cp data/metrics/atm_history.json _site/ || true

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
