name: Gemini javaslatok

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-noise
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Gemini-címkék (napi plafon 30 + 10 hír)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          f=scripts/gemini_labels.py
          [ -f ovl__scripts__gemini_labels.py.txt ] && f=ovl__scripts__gemini_labels.py.txt
          python3 "$f"

      - name: Mentés
        if: always()
        run: |
          git config user.name "mnt-bot"
          git config user.email "mnt-bot@users.noreply.github.com"
          git add data/metrics/gemini_labels.json data/metrics/gemini_budget.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Gemini javaslatok"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
