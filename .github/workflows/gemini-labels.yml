name: Gemini javaslatok

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-noise
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Előző adat a data ágról
        run: scripts/data_branch.sh pull

      - name: Gemini-címkék (napi plafon 30 + 10 hír)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/gemini_labels.py

      - name: Mentés (data ág)
        if: always()
        run: |
          git config user.name "mnt-bot"
          git config user.email "mnt-bot@users.noreply.github.com"
          scripts/data_branch.sh push "Gemini javaslatok $(date -u +%FT%TZ)"
          scripts/data_branch.sh untrack
